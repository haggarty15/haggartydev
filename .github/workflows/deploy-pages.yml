name: Deploy Pages (production + staging preview)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout develop (staging preview)
        id: checkout_develop
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: develop
          path: site-develop

      - name: Assemble combined site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' site-main/ _site/

          if [ "${{ steps.checkout_develop.outcome }}" = "success" ]; then
            mkdir -p _site/staging
            rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' site-develop/ _site/staging/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
